<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Icon Background -->
  <rect width="100" height="100" rx="24" fill="#0A0F1D" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#layerGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Modern Layered Scales / Geometric Legal Icon -->
  <path d="M50 20 L78 34 L50 48 L22 34 Z" fill="url(#layerGrad)" fill-opacity="0.9" />
  <path d="M22 44 L50 58 L78 44" stroke="#38EF7D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M22 58 L50 72 L78 58" stroke="url(#layerGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Scale Pillar & Balance Accent -->
  <circle cx="50" cy="34" r="3" fill="#FFFFFF" filter="url(#glow)" />
  <path d="M50 34 V76" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <circle cx="50" cy="78" r="4" fill="url(#goldGrad)" />
</svg>
